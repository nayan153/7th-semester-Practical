<!DOCTYPE html>
<html>
<head>
    <title>USN and Semester Validation</title>
    <script type="text/javascript">
        function validate() {
            var usn = document.getElementById("usn").value;
            var sem = document.getElementById("sem").value;

            var pattern = /^[1-4][A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{3}$/;

            if (!pattern.test(usn)) {
                alert("Invalid USN!");
                return false;
            }

            if (!/^[1-8]$/.test(sem)) {
                alert("Semester must be between 1 and 8!");
                return false;
            }

            alert("Valid Input!");
            return true;
        }
    </script>
</head>

<body>
    <form onsubmit="return validate()">
        USN:
        <input type="text" id="usn"><br><br>

        Semester:
        <input type="text" id="sem"><br><br>

        <input type="submit" value="Submit">
    </form>
</body>
</html>
