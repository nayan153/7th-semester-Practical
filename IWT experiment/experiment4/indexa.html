<!DOCTYPE html>
<html>
<head>
    <title>USN Validation</title>
    <script type="text/javascript">
        function validate() {
            var usn = document.getElementById("usn").value;
            var pattern = /^[1-4][A-Z]{2}[0-9]{2}[A-Z]{2}[0-9]{3}$/;

            if (!pattern.test(usn)) {
                alert("Invalid USN!");
                return false;
            }

            alert("Valid USN!");
            return true;
        }
    </script>
</head>

<body>
    <form onsubmit="return validate()">
        Enter USN:
        <input type="text" id="usn">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
